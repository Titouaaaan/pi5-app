# The same checks CLAUDE.md asks for before a deploy, run by GitHub on every
# push and once a week. The weekly run is the point: a new advisory against a
# package already in the lockfile shows up as a red run, instead of the next
# time someone remembers npm audit. Nothing here deploys; deploy.sh on the
# Pi is the only thing that ships.
name: checks

on:
  push:
    branches: [main, rework]
  pull_request:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same major as the Pi
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # Runtime deps only: dev tooling (lint, build) never runs on the live
      # site, and a dev-only advisory with no fix (braces via
      # eslint-config-next, 2026-09) would otherwise keep this red for weeks.
      - run: npm audit --omit=dev

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # same as the Pi
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The runner's preinstalled setuptools carries advisories; deploy.sh and
      # the venv docs upgrade it on the Pi for the same reason.
      - run: pip install --upgrade pip setuptools
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: pip-audit
